<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="商品の賞味期限をかんたんに管理できるアプリ" />
    <title>期限みまもり</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-mark" aria-hidden="true">✓</div>
        <div>
          <p class="eyebrow">賞味期限管理アプリ</p>
          <h1>期限みまもり</h1>
        </div>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <div>
          <p class="eyebrow">かんたん在庫チェック</p>
          <h2 id="intro-title">商品の期限を、<br /><span>ひと目で確認。</span></h2>
          <p>商品と賞味期限を登録するだけ。期限の近い順に、自動で整理します。</p>
        </div>
        <div class="legend" aria-label="期限ステータスの説明">
          <span><i class="dot expired"></i>期限切れ</span>
          <span><i class="dot urgent"></i>3日以内</span>
          <span><i class="dot soon"></i>7日以内</span>
          <span><i class="dot safe"></i>それ以上</span>
        </div>
      </section>

      <section class="card form-card" aria-labelledby="form-title">
        <div class="section-heading">
          <div class="icon-box" aria-hidden="true">＋</div>
          <div><h2 id="form-title">商品を登録</h2><p>確認したい商品を追加します</p></div>
        </div>
        <form id="product-form">
          <div class="jan-field">
            <label for="jan-code">JANコード <span class="optional">（8桁または13桁）</span></label>
            <div class="jan-controls">
              <input id="jan-code" name="jan" type="text" inputmode="numeric" autocomplete="off" placeholder="例：4901234567894" maxlength="13" aria-describedby="jan-help" />
              <button id="scan-button" class="scan-button" type="button">▣ カメラで読む</button>
            </div>
            <p id="jan-help" class="field-help">読み取れない場合は数字を入力できます。JANなしでも登録できます。</p>
          </div>
          <label>商品名<input id="product-name" name="name" type="text" placeholder="例：牛乳" maxlength="60" required /></label>
          <label>賞味期限<input id="expiry-date" name="expiry" type="date" required /></label>
          <button class="primary-button" type="submit">商品を登録 <span aria-hidden="true">→</span></button>
        </form>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </section>

      <section class="products-section" aria-labelledby="products-title">
        <div class="list-heading">
          <div>
            <p class="eyebrow">登録した商品</p>
            <h2 id="products-title">商品一覧 <span id="product-count" class="count">0</span></h2>
          </div>
          <p class="sort-note">↕ 期限が近い順</p>
        </div>
        <div id="product-list" class="product-list"></div>
        <div id="empty-state" class="card empty-state">
          <div aria-hidden="true">◷</div>
          <h3>商品はまだありません</h3>
          <p>上のフォームから最初の商品を登録しましょう。</p>
        </div>
      </section>
    </main>

    <dialog id="scanner-dialog" aria-labelledby="scanner-title">
      <div class="scanner-heading">
        <div><p class="eyebrow">バーコード読み取り</p><h2 id="scanner-title">JANコードを枠内に合わせる</h2></div>
        <button id="close-scanner" class="close-button" type="button" aria-label="カメラを閉じる">×</button>
      </div>
      <div class="camera-frame"><video id="camera-preview" playsinline muted></video><div class="scan-guide" aria-hidden="true"></div></div>
      <p id="scanner-message" class="scanner-message" role="status" aria-live="polite">カメラを準備しています…</p>
      <button id="cancel-scanner" class="secondary-button" type="button">キャンセル</button>
    </dialog>

    <template id="product-template">
      <article class="card product-card">
        <div class="status-stripe"></div>
        <div class="product-info">
          <div class="product-top"><h3></h3><span class="status-badge"></span></div>
          <p class="expiry"></p>
          <p class="jan-display" hidden></p>
        </div>
        <div class="actions">
          <button class="check-button" type="button">✓ 確認済みにする</button>
          <button class="delete-button" type="button" aria-label="商品を削除">削除</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
